name: Refresh 004 EPUB

# 定时把 004 的公开页面重排成 EPUB，内容真的变了才提交。
# cron 每 20 分钟叫醒一次，但 job 自己按 INTERVAL_MINUTES（默认 200 分钟）
# 限流：间隔不够就直接跳过，既做到"每 200 分钟刷新一次"，又不浪费 Actions。
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略 200 分钟间隔，立即重新生成"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-epub
  cancel-in-progress: false

env:
  INTERVAL_MINUTES: "200"
  SOURCE_URL: "https://k-macao.github.io/004/"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 限流（距上次生成不足 INTERVAL_MINUTES 就跳过）
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib

          interval = int(os.environ.get("INTERVAL_MINUTES", "200"))
          force = str(os.environ.get("FORCE", "")).strip().lower() in ("true", "1", "yes")
          manifest = pathlib.Path("site/epub.json")
          last = None
          if manifest.is_file():
              try:
                  last = dt.datetime.fromisoformat(json.loads(manifest.read_text("utf-8"))["generated"])
              except (ValueError, KeyError, TypeError):
                  last = None
          now = dt.datetime.now(dt.timezone.utc)
          age = None if last is None else (now - last).total_seconds() / 60
          skip = bool(age is not None and age < interval and not force)
          if force:
              reason = "强制运行"
          elif age is None:
              reason = "没有历史清单"
          elif skip:
              reason = f"上次生成 {age:.0f} 分钟前，未满 {interval} 分钟"
          else:
              reason = f"上次生成 {age:.0f} 分钟前，已满 {interval} 分钟"
          print(f"{'跳过' if skip else '继续'}：{reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"skip={'true' if skip else 'false'}\n")
              out.write(f"reason={reason}\n")
          PY

      - name: 抓 004 并生成 EPUB
        if: steps.gate.outputs.skip != 'true'
        run: python tools/build_epub.py "$SOURCE_URL" --out site

      - name: 内容变了才提交
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/report.epub site/epub.json
          if git diff --cached --quiet; then
            echo "004 内容没有变化，本次不提交"
            exit 0
          fi
          stamp=$(python -c "import json;print(json.load(open('site/epub.json'))['generated'])")
          git commit -m "chore(site): 刷新 004 EPUB（生成于 ${stamp}）"
          git push

      - name: 提示
        if: steps.gate.outputs.skip == 'true'
        run: echo "本次跳过：${{ steps.gate.outputs.reason }}"
