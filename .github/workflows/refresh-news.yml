name: Refresh daily news RSS

# 每天 07:00 北京时间（UTC 前一天 23:00）抓一轮 RSSHub 新闻（财经 / 政治 / 哲学思想），
# 英文条目自动配中文译文（site/news_zh_cache.json 是译文缓存，跟着仓库走），
# 只合成一个聚合 RSS：site/news.xml，然后提交推送。
#
# 同一份 feed 挂在几个互不相关的主机上，设备上一条不通就换下一条（见 docs/kindle-news.md）：
#   https://k-macao.github.io/04-kindle/site/news.xml                       GitHub Pages
#   https://raw.githubusercontent.com/k-macao/04-kindle/main/site/news.xml  raw
#   https://github.com/k-macao/04-kindle/releases/download/news-feed/news.xml  Release 资产
#   https://cdn.jsdelivr.net/gh/k-macao/04-kindle@main/site/news.xml        jsDelivr（另有 fastly/gcore/testingcf）
# 每轮跑完会把这几条逐个取一遍，结果写进 site/feed-mirrors.json。
#
# **这个工作流只生成 xml**：日报 EPUB、清单、纯文本（site/news.epub、news.json、news.txt）
# 不再由它产出，仓库里也不再保留那三个文件——要做那本书时手动跑：
#   python tools/fetch_news.py --out news_data.json
#   python tools/translate_news.py --data news_data.json --cache site/news_zh_cache.json
#   python tools/build_news.py --data news_data.json --out site
#
# 与小时级报告（refresh-epub.yml）完全分开：报告失败不影响新闻，新闻失败也不动报告的产物。
# 条目不足下限、xml 解析不过时不提交——宁可读者手上还是上一份 feed，也不发布一份空 feed。
on:
  schedule:
    # 07:00 Asia/Shanghai。GitHub 的 cron 只认 UTC。
    - cron: "0 23 * * *"
  workflow_dispatch:
  # 改了抓取/排版/源的代码就顺手跑一次：既验证改动，也让 site/news.xml 立刻更新。
  # 只匹配这些文件，提交产物（site/**）不会触发，不会自激。
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-news.yml"
      - "tools/fetch_news.py"
      - "tools/news_sources.py"
      - "tools/build_feed.py"
      - "tools/radar_discover.py"
      - "tools/translate_news.py"

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

env:
  MIN_ITEMS: "10"
  MAX_ITEMS: "150"
  # RSSHub 实例，逗号分隔，顺序＝优先级：官方 rsshub.app 第一，后面是公共镜像。
  # 官方实例对 Actions 出口 IP 回 403 时，抓取脚本会先探活（/healthz）再把它挪到队尾，
  # 所以「先接官方」与「官方挂了也能出报」不冲突；自建实例请放在最前面。
  RSSHUB_BASE: "https://rsshub.app,https://rsshub.rss.tips,https://rsshub.isrss.com,https://rsshub.cups.moe"
  # 这份聚合 RSS 的公开地址（写进 feed 的 <atom:link rel="self">，阅读器据此判断来源）。
  FEED_SELF_URL: "https://raw.githubusercontent.com/k-macao/04-kindle/main/site/news.xml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 跑测试（解析、去重、时间窗、源目录、英译中、feed 结构）
        run: python -m unittest discover -s tests

      # 定时/手动会写标题指纹，保证同一条新闻不会天天重复；改代码触发的运行（push）用
      # --no-seen：既不读也不写指纹，免得把当天还没到 07:00 的条目「提前吃掉」。
      #
      # 每个源按 --providers 的顺序依次试，任何一层成功就停：
      #   直连源站接口 → RSSHub 官方 → RSSHub 镜像 → 站点原生 RSS → RSS-Bridge 代取
      # 结果写进 site/source-health.json（进 Git），贴进 $GITHUB_STEP_SUMMARY。
      - name: 抓一轮新闻（多层退路：直连 / RSSHub / 镜像 / 原生 RSS / RSS-Bridge）
        run: |
          set -euo pipefail
          args=(--out news_data.json --min-items "$MIN_ITEMS"
                --providers direct,rsshub,mirror,native,bridge
                --health site/source-health.json)
          if [ "${{ github.event_name }}" = "push" ]; then
            args+=(--no-seen)
            echo "push 触发：本次不读写标题指纹，按完整时间窗生成"
          fi
          python tools/fetch_news.py "${args[@]}"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          health = json.loads(pathlib.Path("site/source-health.json").read_text(encoding="utf-8"))
          summary = health["summary"]
          print("### 源健康表\n")
          print(f"**{summary['ok']}/{summary['total']} 个源可用**，"
                f"{summary['items']} 条；按层："
                + " / ".join(f"`{k}` {v}" for k, v in sorted(summary["by_provider"].items(),
                                                            key=lambda kv: -kv[1])))
          print("\n| 源 | 结果 | 在哪一层 | 条数 | 前几跳 |")
          print("| --- | --- | --- | --- | --- |")
          for source in health["sources"]:
              attempts = source.get("attempts") or []
              failed = [f"{a['provider']}×" for a in attempts if not a["ok"]]
              mark = "✅" if source["ok"] else "⚠️"
              print(f"| {source['key']} {source['name']} | {mark} | "
                    f"{source['provider'] or '—'} | {source['count']} | {' '.join(failed) or '—'} |")
          PY

      # 英文条目补中文。翻译接口（Google → Lingva → MyMemory）全挂也不该挡住出 feed，
      # 所以这一步允许失败：feed 自检会把「还没配上中文」的条数打出来。
      - name: 英文条目补中文译文
        continue-on-error: true
        run: >-
          python tools/translate_news.py --data news_data.json
          --cache site/news_zh_cache.json --max-items 80 --strict

      - name: 生成聚合 RSS（site/news.xml）
        run: >-
          python tools/build_feed.py --data news_data.json --out site
          --min-items "$MIN_ITEMS" --max-items "$MAX_ITEMS"
          --self-url "$FEED_SELF_URL"

      # 另外出两份同源的小文件。设备上「內容下載失敗」时按体积从小到大试：
      #   news-test.xml 几 KB（只验线路/证书，别的不说明）
      #   news-lite.xml 60 条 + 摘要截断（慢设备/超时）
      #   news.xml      完整版
      - name: 生成精简版与连通性测试版
        run: |
          set -euo pipefail
          base="${FEED_SELF_URL%news.xml}"
          python tools/build_feed.py --data news_data.json --out site \
            --filename news-lite.xml --min-items 5 --max-items 60 --desc-limit 140 \
            --title "004 每日新闻聚合（精简）" --self-url "${base}news-lite.xml"
          python tools/build_feed.py --data news_data.json --out site \
            --filename news-test.xml --min-items 1 --max-items 3 --desc-limit 80 \
            --title "004 新闻订阅（连通性测试）" --self-url "${base}news-test.xml"

      - name: 产物自检（三份 feed：可解析、条数、guid、中文配对、self 地址）
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          from xml.etree import ElementTree

          cjk = re.compile(r"[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]")
          base = os.environ.get("FEED_SELF_URL", "")
          minimum = int(os.environ.get("MIN_ITEMS", "10"))
          targets = (("news.xml", minimum), ("news-lite.xml", 1), ("news-test.xml", 1))
          problems = []
          lines = []

          for name, floor in targets:
              path = pathlib.Path("site", name)
              if not path.is_file():
                  problems.append(f"缺少 {name}")
                  continue
              try:
                  root = ElementTree.fromstring(path.read_bytes())
              except ElementTree.ParseError as exc:
                  problems.append(f"{name} 解析失败：{exc}")
                  continue
              channel = root.find("channel")
              items = channel.findall("item") if channel is not None else []
              if len(items) < floor:
                  problems.append(f"{name} 只有 {len(items)} 条，少于下限 {floor}")
              link = channel.find("{http://www.w3.org/2005/Atom}link") if channel is not None else None
              expected = base.rsplit("/", 1)[0] + "/" + name if base else ""
              if link is None:
                  problems.append(f"{name} 缺少 <atom:link rel=\"self\">")
              elif expected and link.get("href") != expected:
                  problems.append(f"{name} 的 self 地址不对：{link.get('href')}")

              guids = set()
              for item in items:
                  guid = item.findtext("guid") or ""
                  title = item.findtext("title") or ""
                  if not guid:
                      problems.append(f"{name} 有条目缺 guid：{title[:20]}")
                  elif guid in guids:
                      problems.append(f"{name} guid 重复：{guid}")
                  guids.add(guid)
                  if item.findtext("pubDate") is None:
                      problems.append(f"{name} 有条目缺 pubDate：{title[:20]}")
                  # 设备侧硬要求：缺绝对的 <link> 会让 KOReader 的新闻下载器整轮停在中途。
                  item_link = (item.findtext("link") or "").strip()
                  if not item_link.lower().startswith(("http://", "https://")):
                      problems.append(f"{name} 有条目没有绝对的 <link>：{item_link[:40] or '(缺)'}")
                  if not title.strip() or "\n" in title:
                      problems.append(f"{name} 的 <title> 为空或带换行：{title[:20]!r}")

              titles = [item.findtext("title") or "" for item in items]
              paired = sum(1 for title in titles if "｜中文：" in title)
              untranslated = [title for title in titles if not cjk.search(title)]
              lines.append(f"{name}: {len(items)} 条 / {path.stat().st_size} 字节 / "
                           f"中英并列 {paired} / 英文未译 {len(untranslated)}")

          if problems:
              print("；".join(problems), file=sys.stderr)
              raise SystemExit(1)
          for line in lines:
              print(f"自检通过 · {line}")
          print(f"订阅地址：{base.rsplit('/', 1)[0]}/news.xml")
          PY

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交 feed 本体与两个状态文件：标题指纹（跨天去重）和译文缓存。
          # 只提交 feed 本体、标题指纹、译文缓存，以及本轮的源健康表。
          git add site/news.xml site/news-lite.xml site/news-test.xml \
                  site/news_seen.json site/news_zh_cache.json site/source-health.json
          read -r items paired built <<<"$(python - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse("site/news.xml").getroot()
          items = root.findall("./channel/item")
          paired = sum(1 for item in items if "｜中文：" in (item.findtext("title") or ""))
          print(len(items), paired, root.findtext("channel/lastBuildDate"))
          PY
          )"
          git commit --allow-empty -m "chore(news): 聚合 RSS ${items} 条（中英并列 ${paired} 条，${built}）"
          # 定时运行时 HEAD 是默认分支；手动跑时是游离 HEAD，两种都要能推。
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      # 第二个入口：把同一份 feed 挂成 Release 资产。它和 Pages / raw / jsDelivr 是不同的
      # 主机家族，设备上哪条线路通就用哪条。失败不影响主流程（feed 已经在仓库里了）。
      - name: 上传 feed 到 Release（第二个下载入口）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=news-feed
          for name in news.xml news-lite.xml news-test.xml; do cp "site/$name" "$name"; done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" news.xml news-lite.xml news-test.xml --clobber
          else
            gh release create "$tag" news.xml news-lite.xml news-test.xml \
              --title "每日新闻聚合 RSS（每天 07:00 更新）" \
              --notes "订阅地址：https://github.com/k-macao/04-kindle/releases/download/news-feed/news.xml"
          fi
          echo "资产地址前缀：https://github.com/k-macao/04-kindle/releases/download/${tag}/"

      # 把每个对外地址挨个取一遍：哪条 404、哪条能取回多少条，写进 site/feed-mirrors.json。
      # 设备上「内容下载失败」时，先看这份表就知道是地址不对还是那台设备的线路不通。
      - name: 核对对外地址（多入口）
        continue-on-error: true
        run: |
          set -uo pipefail
          rm -f site/feed-mirrors.log
          # 有地址不通时脚本会返回 1，这是正常结果，不是错误；真正的异常会带 Traceback。
          if ! python tools/check_feed_urls.py --write site/feed-mirrors.json \
                 --timeout 20 > site/feed-mirrors.log 2>&1; then
            echo "核对脚本退出码非 0：有地址不通，结果见下"
          fi
          cat site/feed-mirrors.log || true
          { echo '### 对外地址核对'; echo '```'; cat site/feed-mirrors.log; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY" || true
          if grep -q "Traceback" site/feed-mirrors.log 2>/dev/null; then
            echo "::error::核对脚本抛异常，日志留在 site/feed-mirrors.log"
          else
            rm -f site/feed-mirrors.log
          fi
          test -f site/feed-mirrors.json

      - name: 提交镜像核对结果
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f site/feed-mirrors.json ]; then
            git add site/feed-mirrors.json
          else
            echo "::error::核对脚本没有产出 site/feed-mirrors.json"
          fi
          # 只有核对脚本抛异常时才会留下日志，正常轮次里它不存在，顺手把旧的从索引里去掉。
          if [ -f site/feed-mirrors.log ]; then
            git add site/feed-mirrors.log
          else
            git rm --cached -q site/feed-mirrors.log 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "镜像表没有变化，跳过提交"
            exit 0
          fi
          ok=$(python -c "import json;print(json.load(open('site/feed-mirrors.json'))['ok'])")
          total=$(python -c "import json;print(json.load(open('site/feed-mirrors.json'))['total'])")
          git commit -m "chore(news): 对外地址核对 ${ok}/${total} 可用"
          if ! git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
            # 并发运行（手动 + 定时）时远端可能又往前走了一步，rebase 再推一次。
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
