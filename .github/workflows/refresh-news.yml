name: Refresh daily news

# 每天 07:00 北京时间（UTC 前一天 23:00）抓一轮 RSSHub 新闻（财经 / 政治 / 哲学思想），
# 生成独立的一本书：site/news.epub + 清单 site/news.json + 纯文本 site/news.txt，
# 英文条目自动配中文译文（site/news_zh_cache.json 是译文缓存，跟着仓库走），
# 再合成一个聚合 RSS site/news.xml（任何阅读器都能订阅），然后一起提交推送。
# 设备端把 Display mode 切到「News subscription」、新闻清单 URL 指向 site/news.json
# 即可；插件只在清单里的 generated 变了时才重下，所以一天只会下一本新书。
#
# 与小时级报告（refresh-epub.yml）完全分开：报告失败不影响新闻，新闻失败也不动
# 报告的产物。新闻抓不到足够的条目时这一步直接失败——宁可设备上还是昨天的日报，
# 也不要推送一份空书。
on:
  schedule:
    # 07:00 Asia/Shanghai。GitHub 的 cron 只认 UTC。
    - cron: "0 23 * * *"
  workflow_dispatch:
  # 改了抓取/排版/源的代码就顺手跑一次：既验证改动，也让 site/news.xml 立刻更新。
  # 只匹配这些文件，提交产物（site/**）不会触发，不会自激。
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-news.yml"
      - "tools/fetch_news.py"
      - "tools/news_sources.py"
      - "tools/build_news.py"
      - "tools/build_feed.py"
      - "tools/radar_discover.py"
      - "tools/translate_news.py"

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

env:
  MIN_ITEMS: "10"
  MAX_ITEMS: "150"
  # RSSHub 实例，逗号分隔，顺序＝优先级：官方 rsshub.app 第一，后面是公共镜像。
  # 官方实例对 Actions 出口 IP 回 403 时，抓取脚本会先探活（/healthz）再把它挪到队尾，
  # 所以「先接官方」与「官方挂了也能出报」不冲突；自建实例请放在最前面。
  RSSHUB_BASE: "https://rsshub.app,https://rsshub.rss.tips,https://rsshub.isrss.com,https://rsshub.cups.moe"
  # 这份聚合 RSS 的公开地址（写进 feed 的 <atom:link rel="self">，阅读器据此判断来源）。
  FEED_SELF_URL: "https://raw.githubusercontent.com/k-macao/04-kindle/main/site/news.xml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 跑测试（解析、去重、时间窗、排版规则）
        run: python -m unittest discover -s tests

      # 定时/手动（日报模式）会写标题指纹，保证一天只推一次不重复；
      # 改代码触发的运行（push）用 --no-seen：既不读也不写指纹，
      # 免得把当天还没到 07:00 的条目「提前吃掉」，日报就只剩零头。
      - name: 抓一轮 RSSHub 新闻
        run: |
          set -euo pipefail
          args=(--out news_data.json --min-items "$MIN_ITEMS")
          if [ "${{ github.event_name }}" = "push" ]; then
            args+=(--no-seen)
            echo "push 触发：本次不读写标题指纹，按完整 24 小时窗口生成"
          fi
          python tools/fetch_news.py "${args[@]}"

      # 英文条目补中文。翻译接口（Google → Lingva → MyMemory）全挂也不该挡住出报，
      # 所以这一步允许失败：清单里的 zh_missing 会如实记下有几条没配上中文。
      - name: 英文条目补中文译文
        continue-on-error: true
        run: >-
          python tools/translate_news.py --data news_data.json
          --cache site/news_zh_cache.json --max-items 80 --strict

      - name: 生成日报 EPUB + 清单 + 纯文本
        run: >-
          python tools/build_news.py --data news_data.json --out site
          --min-items "$MIN_ITEMS" --max-items "$MAX_ITEMS"

      - name: 生成聚合 RSS（site/news.xml）
        run: >-
          python tools/build_feed.py --data news_data.json --out site
          --min-items "$MIN_ITEMS" --max-items "$MAX_ITEMS"
          --self-url "$FEED_SELF_URL"

      - name: 产物自检（条目数、分节、RSS 可解析、文件可读）
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import zipfile

          minimum = int(os.environ.get("MIN_ITEMS", "10"))
          from xml.etree import ElementTree

          manifest_path = pathlib.Path("site/news.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          problems = []
          if int(manifest.get("items") or 0) < minimum:
              problems.append(f"条目只有 {manifest.get('items')} 条，少于下限 {minimum}")
          if not manifest.get("doc") or not pathlib.Path("site", manifest["doc"]).is_file():
              problems.append("清单指向的 EPUB 不存在")
          if not pathlib.Path("site/news.txt").is_file():
              problems.append("缺少纯文本")
          feed_path = pathlib.Path("site/news.xml")
          feed_items = 0
          if not feed_path.is_file():
              problems.append("缺少聚合 RSS")
          else:
              try:
                  feed_root = ElementTree.fromstring(feed_path.read_bytes())
                  feed_items = len(feed_root.findall("./channel/item"))
              except ElementTree.ParseError as exc:
                  problems.append(f"聚合 RSS 解析失败：{exc}")
              else:
                  if feed_items < minimum:
                      problems.append(f"聚合 RSS 只有 {feed_items} 条，少于下限 {minimum}")
          if problems:
              print("；".join(problems), file=sys.stderr)
              raise SystemExit(1)
          with zipfile.ZipFile(pathlib.Path("site", manifest["doc"])) as book:
              page = book.read("OEBPS/report.xhtml").decode("utf-8")
          sections = page.count("<h2 ")
          articles = page.count("<article")
          if sections < 1 or articles < minimum:
              print(f"排版异常：分节 {sections}、条目 {articles}", file=sys.stderr)
              raise SystemExit(1)
          english = int(manifest.get("english") or 0)
          zh_missing = int(manifest.get("zh_missing") or 0)
          if zh_missing:
              print(f"提示：{zh_missing}/{english} 条英文还没配上中文（翻译接口这轮不通）",
                    file=sys.stderr)
          print(f"自检通过：{manifest['items']} 条 / {sections} 节 / {articles} 个条目 / "
                f"{manifest['bytes']} 字节 / 数据时间 {manifest.get('data_time') or '未知'} / "
                f"RSS {feed_items} 条 / 英文 {english} 条中 {english - zh_missing} 条有中文")
          PY

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/news.epub site/news.json site/news.txt site/news.xml \
                  site/news_seen.json site/news_zh_cache.json
          stamp=$(python -c "import json;print(json.load(open('site/news.json'))['generated'])")
          items=$(python -c "import json;print(json.load(open('site/news.json'))['items'])")
          zh=$(python -c "import json;print(json.load(open('site/news.json')).get('zh_added',0))")
          git commit --allow-empty -m "chore(news): 每日新闻订阅 ${items} 条（英文附中文 ${zh} 条）+ 聚合 RSS（更新于 ${stamp}）"
          # 定时运行时 HEAD 是默认分支；手动跑时是游离 HEAD，两种都要能推。
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
