name: zz probe (temporary)
on:
  workflow_dispatch:
  push:
    branches: [arena/8f0e4cef-04-kindle]
    paths: [".github/workflows/zz-probe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 真跑一遍抓取 + 排版
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          THS_API_KEY: ${{ secrets.THS_API_KEY }}
          THS_KEY: ${{ secrets.THS_KEY }}
        run: |
          set -uo pipefail
          python tools/fetch_stocks.py --out /tmp/stocks_data.json --no-limit-up || echo "抓取失败 $?"
          mkdir -p /tmp/out
          python tools/build_stocks.py --data /tmp/stocks_data.json --out /tmp/out || echo "排版失败 $?"
          cp /dev/null probe-result.txt
          { echo "=== stocks.txt ==="; cat /tmp/out/stocks.txt 2>/dev/null | head -80; } > probe-result.txt
          {
            echo
            echo "=== 计数与耗时 ==="
            python - <<'PY'
          import json
          d = json.load(open("/tmp/stocks_data.json"))
          print("indices:", len(d.get("indices") or []))
          print("market:", {k: (d.get("market") or {}).get(k) for k in
                ("count","up","down","flat","limit_up","limit_down","turnover","avg_ratio")})
          print("hk rows:", len((d.get("hk") or {}).get("rows") or []))
          print("errors:", d.get("errors"))
          idx = d.get("indices") or []
          print("前 15 个指数:", [(r.get("thscode"), r.get("name"), r.get("last_price")) for r in idx[:15]])
          print("板块样例:", [(r.get("thscode"), r.get("name"), r.get("price_change_ratio_pct")) for r in idx if str(r.get("thscode","")).endswith(".TI")][:8])
          PY
          } >> probe-result.txt 2>&1
          ls -la /tmp/out >> probe-result.txt 2>&1
      - name: 写回
        if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add -f probe-result.txt
          git commit -q -m "probe: 端到端实跑（临时）"
          git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
