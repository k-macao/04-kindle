name: zz probe (temporary)
on:
  workflow_dispatch:
  push:
    branches: [arena/8f0e4cef-04-kindle]
    paths: [".github/workflows/zz-probe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 测港股免费数据源
        run: |
          python - <<'PY' 2>&1 | tee probe.txt
          import json, urllib.request, urllib.error

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"

          def get(url, referer=None, enc="utf-8"):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  **({"Referer": referer} if referer else {}),
              })
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw = r.read()
                      return {"ok": True, "status": r.status, "len": len(raw),
                              "head": raw[:400].decode(enc, "replace")}
              except urllib.error.HTTPError as e:
                  return {"ok": False, "http": e.code, "err": str(e)[:200]}
              except Exception as e:
                  return {"ok": False, "err": f"{type(e).__name__}: {e}"[:200]}

          tests = [
              ("腾讯 港股指数", "https://qt.gtimg.cn/q=hkHSI,hkHSCEI,hkHSTECH"),
              ("腾讯 港股个股", "https://qt.gtimg.cn/q=hk00700,hk09988"),
              ("腾讯 A股指数", "https://qt.gtimg.cn/q=sh000001,sz399001"),
              ("新浪 港股指数", "https://hq.sinajs.cn/list=int_hangseng,int_hscei", "https://finance.sina.com.cn"),
              ("新浪 港股个股", "https://hq.sinajs.cn/list=hk00700", "https://finance.sina.com.cn"),
              ("新浪 A股", "https://hq.sinajs.cn/list=sh000001", "https://finance.sina.com.cn"),
          ]
          for t in tests:
              name, url = t[0], t[1]
              ref = t[2] if len(t) > 2 else None
              r = get(url, ref)
              print(f"\n### {name}\n  url={url}\n  {json.dumps(r, ensure_ascii=False)[:500]}")
          PY
      - name: 写回
        if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          cp probe.txt probe-result.txt; git add probe-result.txt
          git commit -q -m "probe: 港股免费源（临时）"
          git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
