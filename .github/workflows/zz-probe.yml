name: zz probe (temporary)  # 终验 v8
on:
  workflow_dispatch:
  push:
    branches: [arena/8f0e4cef-04-kindle]
    paths: [".github/workflows/zz-probe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 目录核对 + 端到端实跑
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          THS_API_KEY: ${{ secrets.THS_API_KEY }}
          THS_KEY: ${{ secrets.THS_KEY }}
        run: |
          set -uo pipefail
          cp /dev/null probe-result.txt
          # ① 用指数目录（带名称）权威核对清单里每个代码到底叫什么
          python - <<'PY' >> probe-result.txt 2>&1
          import json, os, sys
          sys.path.insert(0, "tools")
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import market_watchlist as mw

          KEY = next((os.environ[k] for k in ("HITHINK_FINANCE_API_KEY","THS_API_KEY","THS_KEY") if os.environ.get(k)), "")
          BASE = "https://fuyao.aicubes.cn"
          def hit(path, **params):
              url = BASE + path + ("?" + urlencode(params) if params else "")
              with urlopen(Request(url, headers={"X-api-key": KEY, "User-Agent": "probe"}), timeout=90) as r:
                  return json.loads(r.read().decode())

          catalog = {}
          for tag in ("industry", "cn_concept", "region", "tszs"):
              try:
                  d = hit("/api/a-share-index/catalog/ths-index-list", tag=tag)
              except Exception as exc:
                  print(f"目录 tag={tag} 失败：{exc}")
                  continue
              items = (d.get("data") or {}).get("item") or []
              print(f"目录 tag={tag}: code={d.get('code')} 条数={len(items)}")
              if items:
                  print("  样例:", items[0])
              for it in items:
                  code = it.get("thscode") or it.get("code")
                  if code:
                      catalog[code] = it.get("name") or ""

          print(f"\n目录合计 {len(catalog)} 条")

          # 逐条验证清单：每个代码都要能返回行情
          print("\n=== 逐条验证清单 ===")
          for label, pairs in (("宽基", mw.INDICES), ("板块", mw.SECTORS)):
              codes = [c for c, _ in pairs]
              bad = []
              for i in range(0, len(codes), 40):
                  chunk = codes[i:i+40]
                  try:
                      b = hit("/api/a-share-index/prices/snapshot",
                              thscodes=",".join(chunk))
                  except Exception as exc:
                      bad += chunk
                      print(f"  批次失败 {exc}")
                      continue
                  got = {it.get("thscode") for it in (b.get("data") or {}).get("item") or []}
                  bad += [c for c in chunk if c not in got]
              print(f"  {label}：{len(codes)} 个，无效 {len(bad)} 个 {bad}")

          print("\n=== 港股名称核对 ===")
          hk = [c for c, _ in mw.HK_INDICES + mw.HK_STOCKS]
          url = "https://qt.gtimg.cn/q=" + ",".join(hk)
          raw = urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0",
                                              "Referer": "https://finance.qq.com/"}),
                        timeout=30).read()
          text = raw.decode("gbk", "replace")
          real, mine = {}, dict(mw.HK_INDICES + mw.HK_STOCKS)
          for line in text.split(";"):
              line = line.strip()
              if not line.startswith("v_"):
                  continue
              key = line.split("=")[0][2:]
              f = line.split('="', 1)[-1].rstrip('"').split("~")
              if len(f) > 3:
                  real[key] = f[1]
          for code in hk:
              got, want = real.get(code), mine.get(code)
              if got is None:
                  print(f"    {code}: 腾讯无数据（清单「{want}」）")
              elif got.strip() != (want or "").strip():
                  print(f"    {code}: 清单「{want}」→ 腾讯「{got}」")
          PY

          # ② 端到端：真抓一轮 → 排版 → 出 txt
          echo -e "\n=== 端到端实跑 ===" >> probe-result.txt
          python tools/fetch_stocks.py --out /tmp/stocks_data.json --no-limit-up >> probe-result.txt 2>&1 \
            || echo "抓取失败 $?" >> probe-result.txt
          mkdir -p /tmp/out
          python tools/build_stocks.py --data /tmp/stocks_data.json --out /tmp/out >> probe-result.txt 2>&1 \
            || echo "排版失败 $?" >> probe-result.txt
          { echo; echo "=== stocks.txt 全文 ==="; cat /tmp/out/stocks.txt 2>/dev/null; } >> probe-result.txt
          {
            echo
            echo "=== 自检：板块是否一个不丢 ==="
            python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import market_watchlist as mw
          txt = open("/tmp/out/stocks.txt", encoding="utf-8").read()
          missing = [n for _, n in mw.SECTORS if n not in txt]
          print("板块总数:", len(mw.SECTORS), "文本里缺失:", missing)
          for name in ("贵金属", "影视院线", "游戏"):
              print(f"  {name}:", "在" if name in txt else "缺")
          idx = txt.split("【指数】")[1].split("\n\n")[0]
          print("【指数】行数:", len([l for l in idx.splitlines()[1:] if l.strip()]))
          PY
          } >> probe-result.txt 2>&1
          {
            echo
            echo "=== 计数 ==="
            python - <<'PY'
          import json
          d = json.load(open("/tmp/stocks_data.json"))
          m = d.get("market") or {}
          print("indices:", len(d.get("indices") or []))
          print("market:", {k: m.get(k) for k in
                ("count","total","up","down","flat","no_price","limit_up","limit_down","turnover","avg_ratio")})
          print("hk rows:", len((d.get("hk") or {}).get("rows") or []))
          print("index_timestamp:", d.get("index_timestamp"), " data_timestamp:", d.get("data_timestamp"))
          print("errors:", d.get("errors"))
          idx = d.get("indices") or []
          print("宽基:", [(r.get("thscode"), r.get("name"), r.get("last_price")) for r in idx if not r.get("is_sector")])
          print("板块数:", len([r for r in idx if r.get("is_sector")]))
          print("板块前 6:", [(r.get("thscode"), r.get("name"), r.get("price_change_ratio_pct")) for r in idx if r.get("is_sector")][:6])
          PY
            ls -l /tmp/out
          } >> probe-result.txt 2>&1
      - name: 写回
        if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          # 这期间若有别的提交（比如我本地又推了东西），rebase 后再推，别静默丢掉结果
          for i in 1 2 3 4 5; do
            git add -f probe-result.txt
            git commit -q -m "probe: 目录核对 + 端到端（临时）" || true
            git fetch -q origin || true
            git rebase -q "origin/${GITHUB_REF_NAME}" || git rebase --abort || true
            if git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "写回成功（第 $i 次）"; exit 0
            fi
            sleep 5
          done
          echo "push 一直失败"; exit 1
