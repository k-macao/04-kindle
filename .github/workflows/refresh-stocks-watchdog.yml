name: THS stock panel watchdog

# 主力不是这个文件：refresh-stocks.yml 自己会在一次运行里连续刷满交易时段
# （见那边的 "交易时段自循环" 步骤）。这里只是「补一枪」——cron 在本仓库被限流到
# 每天 3–4 次（实测：配置每 15 分钟，4.2 小时里 0 次触发；连每小时任务的实际间隔
# 也是 4–10 小时），所以这个 watchdog 自己也不能指望 cron 一定叫醒它。
# 一旦被叫醒（cron 或任何 workflow_dispatch），它看一眼 data_time：
#
#   - 距现在 > 25 分钟（盘中）→ 判定自循环也断了，立刻 workflow_dispatch 补跑一轮；
#   - 周末 / 收盘后（北京时间 15:05 之后、以及 09:15 之前）→ 什么都不做；
#   - 同一次补跑最多每 10 分钟触发一次（concurrency 保证）。
#
# 它只负责「叫醒」，真正的抓取/排版/提交还在 refresh-stocks.yml 里，逻辑只有一份。

on:
  schedule:
    # 交易时段每 10 分钟（UTC 01:00–07:55 = 北京时间 09:00–15:55）。
    - cron: "8,28,48 1-7 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: stocks-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 看 data_time 是否落后（落后就补跑一轮）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python tools/stocks_watchdog.py --stale-minutes 25 --dispatch
