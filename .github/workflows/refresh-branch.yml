name: Refresh 004 artifacts (branch preview)

# 临时工作流：只在本 Arena 分支上跑，用来立刻用真实页面重建两种字模式产物
# （site/report.epub + site/epub.json + kindle.txt），验证「正文全留、状态类文字不要」
# 的过滤规则在真实构建页上的效果。合并前会删掉这个文件；即使漏删，它的触发条件
# 也只认这一条分支，不会影响 main 的每小时刷新。
# 提交信息带 [skip ci]，避免自己推自己造成循环。
on:
  push:
    branches:
      - "arena/e81538a4-04-kindle"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-branch-preview
  cancel-in-progress: false

env:
  MAX_SOURCE_AGE_HOURS: "12"
  SOURCE_URL: "https://k-macao.github.io/004/"
  BRANCH: "arena/e81538a4-04-kindle"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 跑测试
        run: python -m unittest discover -s tests

      - name: 抓 004 并生成 EPUB + 纯文本
        run: |
          python tools/build_epub.py "$SOURCE_URL" --out site
          python kindle_report.py "$SOURCE_URL" --format text -o kindle.txt

      - name: 检查源数据时间（仅警告）
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import sys

          sys.path.insert(0, "tools")
          from build_epub import check_data_age

          max_hours = float(os.environ.get("MAX_SOURCE_AGE_HOURS", "12"))
          manifest = pathlib.Path("site/epub.json")
          data_time = None
          if manifest.is_file():
              try:
                  data_time = json.loads(manifest.read_text("utf-8")).get("data_time") or None
              except (ValueError, OSError):
                  data_time = None
          ok, reason = check_data_age(data_time, dt.datetime.now(dt.timezone.utc), max_hours)
          print(("源数据时间正常：" if ok else "::warning title=004 源数据可能过期::") + reason)
          PY

      - name: 状态类文字残留自检
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import zipfile

          sys.path.insert(0, ".")
          from kindle_report import is_status_text

          text = pathlib.Path("kindle.txt").read_text("utf-8")
          leftovers = [line for line in text.splitlines() if is_status_text(line)]
          body = zipfile.ZipFile("site/report.epub").read("OEBPS/report.xhtml").decode("utf-8")
          for marker in ("STATUS &gt;", "抓取状态", "当次实抓", "抓取核验 ", "SOURCE FEEDS",
                         "数据缺口", "项同步成功", "条入库"):
              if marker in body:
                  leftovers.append(f"EPUB 里还有 {marker}")
          lines = len([x for x in text.splitlines() if x.strip()])
          print(f"kindle.txt 行数 {lines}，EPUB 字符数见 epub.json")
          if leftovers:
              print("::error title=状态类文字残留::" + " | ".join(leftovers[:8]))
              raise SystemExit(1)
          print("状态类文字已清空：kindle.txt 与 report.epub 都没有残留")
          PY

      - name: 提交并推送到本分支
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/report.epub site/epub.json kindle.txt
          stamp=$(python -c "import json;print(json.load(open('site/epub.json'))['generated'])")
          removed=$(python -c "import json;print(json.load(open('site/epub.json')).get('status_removed',0))")
          git commit --allow-empty -m "chore(site): 用真实页面重建产物（更新于 ${stamp}，删掉 ${removed} 块状态文字）[skip ci]"
          git push origin "HEAD:refs/heads/${BRANCH}"
