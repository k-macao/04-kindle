name: Refresh THS stock panel

# 同花顺金融数据服务（hithink-finance，官方 GitHub 仓库 Hithink-Tech-Org/Financial-API）
# 的 A 股行情快照 → site/stocks.json（清单+数据）/ stocks.txt（Kindle 纯文本面板）/
# stocks.html（网页面板，每 60 秒拉一次 stocks.json）。
#
# 频率说明：GitHub Actions 的 cron 最短 5 分钟，做不到真正的 1 分钟一轮。
# 这里在 A 股交易时段（北京时间 09:00–15:55，周一到周五）每 5 分钟抓一轮；
# Kindle 插件与网页面板每 60 秒检查一次清单，generated 变了才刷新——
# 设备端「一分钟」指的是检查间隔，数据新鲜度以清单里的 data_time 为准。
# 本地要真正的 60 秒一轮：HITHINK_FINANCE_API_KEY=… python tools/fetch_stocks.py
# --loop 60 --build（见 docs/kindle-stocks.md）。
#
# API Key 放在仓库 Actions Secret（THS_API_KEY / THS_KEY，官方名
# HITHINK_FINANCE_API_KEY 也兼容），不写入仓库、不进日志。行情没变（data_hash 相同）时不提交，
# 免得收盘后每 5 分钟刷一堆空提交。
on:
  schedule:
    # 北京时间 09:00–15:55（UTC 01:00–07:55），周一到周五，每 5 分钟。
    - cron: "*/5 1-7 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-stocks.yml"
      - "tools/fetch_stocks.py"
      - "tools/build_stocks.py"
      - "tools/stock_watchlist.py"

permissions:
  contents: write

concurrency:
  group: refresh-stocks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 跑测试（信封解析、重试、归一化、排版、自检）
        run: python -m unittest discover -s tests

      # 抓取只负责取回并归一化 → stocks_data.json（不进 Git）；
      # 排版是下一步 build_stocks 的事，改模板不用重抓。
      - name: 从同花顺抓一轮行情快照
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          THS_API_KEY: ${{ secrets.THS_API_KEY }}
          THS_KEY: ${{ secrets.THS_KEY }}
        run: python tools/fetch_stocks.py --out stocks_data.json

      - name: 排版成清单 + Kindle 文本 + 网页面板
        run: python tools/build_stocks.py --data stocks_data.json --out site

      - name: 产物自检（清单可解析、条数、60 秒轮询）
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import build_stocks

          problems = build_stocks.check("site")
          if problems:
              print("；".join(problems), file=sys.stderr)
              raise SystemExit(1)
          print("自检通过 · site/stocks.json + stocks.txt + stocks.html")
          PY

      - name: 提交并推送（行情没变就不提交）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/stocks.json site/stocks.txt site/stocks.html site/stocks_names.json
          # 行情指纹没变（收盘后/周末快照时间不变）就跳过，免得刷空提交。
          old_hash=$(git show HEAD:site/stocks.json 2>/dev/null \
            | python -c "import json,sys;print(json.load(sys.stdin).get('data_hash',''))" || echo "")
          new_hash=$(python -c "import json;print(json.load(open('site/stocks.json'))['data_hash'])")
          if [ -n "$old_hash" ] && [ "$old_hash" = "$new_hash" ]; then
            echo "行情没变（data_hash $new_hash），跳过提交"
            exit 0
          fi
          counts=$(python -c "import json;c=json.load(open('site/stocks.json'))['counts'];print(f\"指数 {c['indices']} / 股票 {c['stocks']} / 涨停 {c['limit_up']}\")")
          stamp=$(python -c "import json;print(json.load(open('site/stocks.json'))['generated'])")
          git commit --allow-empty -m "chore(stocks): 同花顺行情面板刷新（${counts}，生成于 ${stamp} 北京时间）"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
