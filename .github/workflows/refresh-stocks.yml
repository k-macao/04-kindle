name: Refresh THS stock panel

# 同花顺金融数据服务（hithink-finance，官方 GitHub 仓库 Hithink-Tech-Org/Financial-API）
# 的 A 股行情（快照 + 近 20 日 K 线）→ site/stocks.json（清单+数据）/
# stocks.html（浏览器卡片仪表盘）/ stocks.epub（Kindle 字模式卡片版）/
# stocks.txt（纯文本回退版）。
#
# 频率说明：GitHub Actions 的 cron 在这个仓库**极不靠谱**——实测有 4.2 小时 0 次、
# 也有本该 07:48 跑的班次迟到到 18:34（收盘后 3.5 小时）才跑。所以不能指望
# cron 卡在开盘那一刻。这里的做法是「一次触发，长期常驻」：
#
#   1. cron / push / 手动 dispatch 任意一次把本工作流叫起来；
#   2. "常驻自循环" 步骤留在同一个 runner 里：
#        · 抓取窗口内（北京 09:00–15:30，周一到周五）每 15 分钟抓一轮；
#        · 窗口外（收盘后、深夜、周末）长睡，每 30 分钟醒一次看一眼；
#      因为常驻，一次**迟到几小时**的 cron 也不会白跑——它会一直等到次日开盘自己开工。
#   3. 预算（约 5.5 小时）用完时，如果今天还有活要干，就 workflow_dispatch
#      把下一棒交给自己（GITHUB_TOKEN 可以触发 dispatch，已实测），接力继续。
#
# refresh-stocks-watchdog.yml 是额外的保险：被叫醒时若发现 data_time 落后
# >25 分钟（且在该抓的窗口内）就补一枪。
# Kindle 插件与网页面板每 7 分钟检查一次清单，generated 变了才刷新；
# 数据新鲜度以清单里的 data_time 为准（面板抬头会写「N 分钟前」与 STALE）。
# 本地要真正的 60 秒一轮：HITHINK_FINANCE_API_KEY=… python tools/fetch_stocks.py
# --loop 60 --build（见 docs/kindle-stocks.md）。
#
# API Key 放在仓库 Actions Secret（THS_API_KEY / THS_KEY，官方名
# HITHINK_FINANCE_API_KEY 也兼容），不写入仓库、不进日志。行情没变（data_hash 相同）时不提交，
# 免得收盘后每 5 分钟刷一堆空提交。
on:
  schedule:
    # UTC 01:00–07:30 = 北京 09:00–15:30，周一到周五，每 15 分钟一班
    # （分钟错开整点 3/18/33/48，避免和全网整点任务撞车被延迟）。
    # 注意这只决定「有没有人按第一次按钮」，跑起来之后靠常驻自循环接力；
    # cron 迟到几小时也不会白费（窗口外它会睡到次日开盘）。
    - cron: "3,18,33,48 1-7 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-stocks.yml"
      - "tools/fetch_stocks.py"
      - "tools/build_stocks.py"
      - "tools/sector_rrg.py"
      - "tools/market_watchlist.py"
      - "tools/fetch_hk.py"

permissions:
  contents: write
  actions: write        # 收尾时 workflow_dispatch 把下一棒交给自己

concurrency:
  group: refresh-stocks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # 作业上限 6 小时；留 10 分钟给收尾交接
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 跑测试（信封解析、重试、归一化、排版、自检）
        run: python -m unittest discover -s tests

      # 测试里不许**无条件**依赖第三方库：CI runner 只有标准库。
      # （#57 就是因为在测试函数体里 import yaml，合并后 refresh-stocks 每次都在
      #   「跑测试」挂掉，错误混在一大堆测试输出里，很不好认。）
      # 注意有的测试是 try/except ImportError + skipUnless 的可选依赖（PIL / lupa），
      # 那是合法的，这里只拦「模块顶层无条件 import」。
      - name: 检查测试只无条件依赖标准库
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import pathlib
          import sys

          allowed = set(sys.stdlib_module_names) | {"tests"}
          # 仓库自己的模块：tools/ 下的，以及仓库根目录的 kindle_report.py
          local = {p.stem for p in pathlib.Path("tools").glob("*.py")}
          local |= {p.stem for p in pathlib.Path(".").glob("*.py")}
          bad = []
          for path in pathlib.Path("tests").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              # 只检查模块顶层（try: import PIL 这种包在 Try 里的算可选依赖，放行）
              for node in tree.body:
                  if isinstance(node, ast.Import):
                      names = [(a.name.split(".")[0], node.lineno) for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0:
                      names = [((node.module or "").split(".")[0], node.lineno)]
                  else:
                      continue
                  for name, line in names:
                      if name and name not in allowed and name not in local:
                          bad.append(f"{path}:{line} import {name}")
          if bad:
              print("测试在模块顶层 import 了非标准库模块（CI 上会直接失败）：", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              print("确实需要时请包在 try/except ImportError + @unittest.skipUnless 里。",
                    file=sys.stderr)
              raise SystemExit(1)
          print("测试的顶层依赖只有标准库与 tools/ ✓")
          PY

      # ── 交易时段自循环 ────────────────────────────────────────────────
      # 一次触发，在同一个 runner 里连续刷到预算用完，再 workflow_dispatch 交接下一棒。
      # 每轮：抓取 → 排版 → 自检 → 提交（行情没变不提交）。
      # ── 常驻自循环 ──────────────────────────────────────────────────
      # 一次触发后就一直待在 runner 里：抓取窗口内每 15 分钟一轮，窗口外长睡
      # （每 30 分钟醒一次看一眼），跨过收盘/整夜，次日开盘自动继续，直到预算用完。
      #
      # 为什么不在窗口外直接退出：cron 在本仓库会迟到几小时（实测 07:48 那班
      # 18:34 才跑）。如果窗口外立刻退出，那次触发就白费了；常驻才能把「被迟到
      # 叫醒」变成「一直活着，开盘自己开工」。
      - name: 常驻自循环（窗口内每 15 分钟一轮，窗口外长睡，跑满预算交接）
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          THS_API_KEY: ${{ secrets.THS_API_KEY }}
          THS_KEY: ${{ secrets.THS_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 作业上限 350 分钟；留 20 分钟给收尾交接。
          deadline=$(( $(date +%s) + 330 * 60 ))
          round=0
          fails=0

          while : ; do
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "预算用完：收尾交接"
              break
            fi

            if ! python tools/stocks_watchdog.py --in-window; then
              # 窗口外（收盘后/深夜/周末）：睡一大段再看。
              # cap 1800 = 最多睡 30 分钟，这样作业里不会出现一次超长 sleep，
              # 也方便「预算到点」及时收尾；下限 60 秒，避免空转刷日志。
              nap=$(python tools/stocks_watchdog.py --sleep-until-window 1800)
              [ $((now + nap)) -gt "$deadline" ] && nap=$((deadline - now))
              [ "$nap" -lt 60 ] && nap=60
              [ $((now + nap)) -gt "$deadline" ] && nap=$((deadline - now))
              echo "窗口外：睡 $((nap / 60)) 分 $((nap % 60)) 秒再看"
              sleep "$nap"
              continue
            fi

            round=$((round + 1))
            echo "── 第 $round 轮 · $(date -u +%FT%TZ) ──"

            # 抓取只负责取回并归一化 → stocks_data.json（不进 Git）；
            # 排版是下一步 build_stocks 的事，改模板不用重抓。
            # --history-days 20：迷你走势图要的近 20 个交易日收盘价（0 = 不取）。
            if ! python tools/fetch_stocks.py --out stocks_data.json --history-days 20; then
              fails=$((fails + 1))
              echo "::warning::第 $round 轮抓取失败（连续 $fails 次），稍后重试"
              # 连续 4 次（约 1 小时）抓不到，就别再占着 runner 连轴转了。
              if [ "$fails" -ge 4 ]; then
                echo "::error::连续 $fails 轮抓取失败，停止自循环（检查 Secret / 接口状态）"
                echo "ABORT_HANDOFF=1" >> "$GITHUB_ENV"
                exit 1
              fi
            else
              fails=0
              # 开盘前的空壳快照会被 build_stocks 拒掉（不覆盖上一份有效面板），
              # 这里也当「这轮跳过」，不是错误。
              if python tools/build_stocks.py --data stocks_data.json --out site \
                 && python tools/check_stocks.py site; then
                git add site/stocks.json site/stocks.txt site/stocks.html site/stocks.epub site/stocks_names.json
                old_hash=$(git show HEAD:site/stocks.json 2>/dev/null \
                  | python -c "import json,sys;print(json.load(sys.stdin).get('data_hash',''))" || echo "")
                new_hash=$(python -c "import json;print(json.load(open('site/stocks.json'))['data_hash'])")
                if [ -n "$old_hash" ] && [ "$old_hash" = "$new_hash" ]; then
                  echo "行情没变（data_hash $new_hash），跳过提交"
                else
                  # counts 字段随面板升级变过（stocks → sectors/market/hk），
                  # 这里用 .get 兜底：提交说明拼不出来不该毁掉整轮抓取。
                  counts=$(python -c "import json;c=json.load(open('site/stocks.json'))['counts'];print(f\"指数 {c.get('indices', 0)} / 板块 {c.get('sectors', 0)} / 全市场 {c.get('market', 0)} / 港股 {c.get('hk', 0)} / 涨停 {c.get('limit_up', 0)}\")" 2>/dev/null || echo "行情")
                  stamp=$(python -c "import json;print(json.load(open('site/stocks.json'))['generated'])")
                  git commit -q -m "chore(stocks): 同花顺行情面板刷新（${counts}，生成于 ${stamp} 北京时间）"
                  # push 可能被别的提交抢先（工作流/PR），失败就 rebase 再来一次。
                  if ! git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
                    echo "push 被拒，rebase 后重试"
                    git pull --rebase -q origin "${GITHUB_REF_NAME}" && \
                      git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || \
                      echo "::warning::这一轮没推上去，下一轮再试"
                  fi
                fi
              else
                echo "::warning::第 $round 轮排版/自检没过（可能是空壳快照），不提交"
              fi
            fi

            # 窗口内 15 分钟一轮；别睡过预算。
            now=$(date +%s)
            [ "$now" -ge "$deadline" ] && continue
            nap=900
            [ $((now + nap)) -gt "$deadline" ] && nap=$((deadline - now))
            echo "睡 $((nap / 60)) 分钟"
            sleep "$nap"
          done

      - name: 交接下一棒（今天还有活就把自己再叫起来）
        if: always() && env.ABORT_HANDOFF != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/stocks_watchdog.py --handoff
