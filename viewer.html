<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>章鱼 AI·舆情004 · Kindle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#000;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}
#screen{height:100%;padding:3.5%;display:flex;flex-direction:column}header{font-size:32px;font-weight:bold;border-bottom:2px solid #000;padding-bottom:6px;flex:none}#content{font-size:32px;line-height:1.48;white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere;flex:1;min-height:0}footer{border-top:1px solid #000;font-size:19px;line-height:1.3;padding-top:5px;flex:none}#measure{position:fixed;visibility:hidden;white-space:pre-wrap;overflow-wrap:anywhere;font-size:32px;line-height:1.48;left:-10000px;top:0}
</style>
</head>
<body><div id="screen"><header>章鱼 AI · 舆情004</header><div id="content"></div><footer><span id="page"></span> · 报告转换时间 <span id="generated"></span> · 数据时间以正文为准</footer></div><div id="measure" aria-hidden="true"></div>
<script>
'use strict';
const report = /* REPORT_DATA */;
const content = document.getElementById('content');
const measure = document.getElementById('measure');
const pageLabel = document.getElementById('page');
document.getElementById('generated').textContent = report.generated;
let pages = [];
function paginate() {
  measure.style.width = content.clientWidth + 'px';
  const height = content.clientHeight;
  if (!height || !content.clientWidth) return;
  const chars = Array.from(report.text);
  pages = [];
  let start = 0;
  while (start < chars.length) {
    let lo = 1, hi = chars.length - start, best = 0;
    while (lo <= hi) {
      const mid = Math.floor((lo + hi) / 2);
      measure.textContent = chars.slice(start, start + mid).join('');
      if (measure.offsetHeight <= height) { best = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    if (!best) { content.textContent = '屏幕尺寸过小，无法分页'; return; }
    // Prefer ending at a line break, without dropping any text.
    if (start + best < chars.length) {
      const candidate = chars.slice(start, start + best).join('');
      const lastLine = candidate.lastIndexOf('\n');
      if (lastLine > candidate.length / 2) best = Array.from(candidate.slice(0, lastLine + 1)).length;
    }
    pages.push(chars.slice(start, start + best).join(''));
    start += best;
  }
  showPage();
}
function showPage() {
  if (!pages.length) return;
  const index = Math.floor(Date.now() / 60000) % pages.length;
  content.textContent = pages[index];
  pageLabel.textContent = `第 ${index + 1} / ${pages.length} 页 · 每分钟轮播`;
}
window.addEventListener('resize', paginate);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(paginate); else paginate();
setInterval(showPage, 1000);
</script></body></html>
